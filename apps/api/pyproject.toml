[project]
name = "star-itsm-api"
version = "0.1.0"
description = "STARdesk ITSM API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=45.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "openpyxl>=3.1.5",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/star_itsm_api"]

[tool.hatch.build.targets.wheel.force-include]
# Single tree — do not also force-include sql/migrations (duplicate wheel paths).
"src/star_itsm_api/sql" = "star_itsm_api/sql"

[tool.vercel]
entrypoint = "star_itsm_api.main:app"

[tool.vercel.scripts]
build = "pip install ."

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not destructive'"
markers = [
    "destructive: abuse/failure-mode tests; opt-in via -m destructive and ALLOW_DESTRUCTIVE=1",
]

[tool.coverage.run]
source = ["star_itsm_api"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    # kodepraksis #39 phase 1 (partial): safe autofix-friendly rules
    "SIM",
    "RET",
    "ARG",
    "PTH",
]
# Phase 2 (kodepraksis tick #39b): add C90, S, D with per-file-ignores on tickets.py — 782 violations if enabled at once
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "ARG005"]
