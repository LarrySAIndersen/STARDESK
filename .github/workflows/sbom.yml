name: SBOM Generation

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  sbom-generation:
    name: Generate and Upload CycloneDX SBOMs
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- WEB (Next.js) SBOM ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: cd apps/web && npm ci

      - name: Generate Web SBOM (CycloneDX)
        run: cd apps/web && npm run sbom

      # --- API (FastAPI) SBOM ---
      - name: Setup UV (Python Package Manager)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Generate API SBOM (CycloneDX)
        run: uv export --format cyclonedx1.5 --output-file apps/api/src/star_itsm_api/sbom.json
        working-directory: apps/api

      # --- UPLOAD ARTIFACTS ---
      - name: Upload Web SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web-json
          path: apps/web/public/sbom.json
          if-no-files-found: error

      - name: Upload API SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api-json
          path: apps/api/src/star_itsm_api/sbom.json
          if-no-files-found: error

      # --- UPLOAD TO DEPENDENCY-TRACK ---
      - name: Upload Web SBOM to Dependency-Track
        if: env.DEPENDENCYTRACK_APIKEY != '' && env.DEPENDENCYTRACK_HOSTNAME != ''
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ env.DEPENDENCYTRACK_HOSTNAME }}
          apiKey: ${{ env.DEPENDENCYTRACK_APIKEY }}
          projectName: 'star-itsm-web'
          projectVersion: ${{ github.ref_name }}
          bomFilename: 'apps/web/public/sbom.json'
          autoCreate: true
        env:
          DEPENDENCYTRACK_APIKEY: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          DEPENDENCYTRACK_HOSTNAME: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}

      - name: Upload API SBOM to Dependency-Track
        if: env.DEPENDENCYTRACK_APIKEY != '' && env.DEPENDENCYTRACK_HOSTNAME != ''
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverHostname: ${{ env.DEPENDENCYTRACK_HOSTNAME }}
          apiKey: ${{ env.DEPENDENCYTRACK_APIKEY }}
          projectName: 'star-itsm-api'
          projectVersion: ${{ github.ref_name }}
          bomFilename: 'apps/api/src/star_itsm_api/sbom.json'
          autoCreate: true
        env:
          DEPENDENCYTRACK_APIKEY: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          DEPENDENCYTRACK_HOSTNAME: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
