name: Database migrate (manual)

# Manual re-run of Alembic against production/test DB.
# On push to main, migrate runs automatically after api-security in security.yml.

on:
  workflow_dispatch:

concurrency:
  group: database-migrate-manual
  cancel-in-progress: false

jobs:
  alembic-upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API package
        run: pip install -e .
      - name: Alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set repository secret DATABASE_URL (postgresql+asyncpg://…)."
            exit 1
          fi
          alembic upgrade head
      - name: Verify migration head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic current
