# Audit direct pushes to main/staging (permanent PR-only policy).
# Hard block: GitHub branch protection — docs/pr-only-policy.md
name: PR-only audit

on:
  push:
    branches: [main, staging]

jobs:
  audit-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Detect likely direct push
        uses: actions/github-script@v7
        with:
          script: |
            const msg = context.payload.head_commit?.message || '';
            const branch = context.ref.replace('refs/heads/', '');
            const isMerge =
              msg.startsWith('Merge pull request') ||
              msg.startsWith('Merge branch') ||
              (msg.includes('(#') && msg.includes(')'));
            if (isMerge) {
              core.info(`Merge commit on ${branch} — OK.`);
              return;
            }
            core.warning(
              `Direct push to ${branch} violates permanent PR-only policy. ` +
                `Use feature branch + PR. See docs/pr-only-policy.md. Commit: ${msg.split('\n')[0]}`
            );
            await core.summary
              .addHeading(`PR-only audit: direct push to ${branch}`)
              .addRaw(
                'Enable branch protection (Settings → Branches). ' +
                  'See [pr-only-policy.md](docs/pr-only-policy.md).'
              )
              .write();
