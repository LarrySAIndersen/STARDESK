# Warn when someone pushes directly to main/staging (not via merge commit).
# Real block requires GitHub branch protection — see docs/pr-only-period.md
name: PR-only audit

on:
  push:
    branches: [main, staging]

jobs:
  audit-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Detect likely direct push
        uses: actions/github-script@v7
        with:
          script: |
            const msg = context.payload.head_commit?.message || '';
            const branch = context.ref.replace('refs/heads/', '');
            const isMerge =
              msg.startsWith('Merge pull request') ||
              msg.startsWith('Merge branch') ||
              msg.includes('(#' ) && msg.includes(')');
            if (isMerge) {
              core.info(`Merge commit on ${branch} — OK.`);
              return;
            }
            core.warning(
              `Direct push to ${branch} detected during PR-only period. ` +
                `Use feature branch + PR. See docs/pr-only-period.md. Commit: ${msg.split('\n')[0]}`
            );
            await core.summary
              .addHeading(`PR-only audit: direct push to ${branch}`)
              .addRaw(
                'Enable branch protection on GitHub (Settings → Branches). ' +
                  'See [pr-only-period.md](docs/pr-only-period.md).'
              )
              .write();
