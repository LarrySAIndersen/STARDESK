sonar.projectKey=LarrySAIndersen_STARDESK
# SonarCloud org key (Project Settings → Information) — not the GitHub username
sonar.organization=0308larrysaindersen0308
sonar.sources=apps/api/src,apps/web/src,scripts
sonar.tests=apps/api/tests
sonar.test.inclusions=**/*test*.py,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/docs/**,**/*.sql,**/helpdesk-login/**,**/node_modules/**,**/.next/**,**/reports/**,**/__pycache__/**,**/.venv/**,**/uv.lock,**/workboard/**,**/init.sql,apps/project-kanban/**,scripts/performance-agent/**
# Seed/migration SQL: duplicate literal rule is not actionable (plsql:S1192)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.python.version=3.12
sonar.python.coverage.reportPaths=apps/api/coverage.xml
# Web excluded until Vitest covers meaningful share of apps/web/src (LCOV is ~1 file today).
sonar.coverage.exclusions=apps/web/src/**,scripts/**
# Keep LCOV path for CI; Sonar ignores uncovered excluded paths in the gate.
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
