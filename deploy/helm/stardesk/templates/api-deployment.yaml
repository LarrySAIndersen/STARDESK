apiVersion: apps/v1
kind: Deployment
metadata:
  name: stardesk-api
  namespace: {{ .Values.namespace }}
  labels:
    app: stardesk-api
    {{- include "stardesk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app: stardesk-api
  template:
    metadata:
      labels:
        app: stardesk-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: stardesk-config
            - secretRef:
                name: stardesk-secrets
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
