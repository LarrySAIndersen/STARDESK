{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stardesk
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "stardesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stardesk-web
                port:
                  name: http
          {{- if .Values.ingress.exposeApi }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stardesk-api
                port:
                  name: http
          {{- end }}
{{- end }}
